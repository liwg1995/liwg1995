<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 165" role="img" aria-label="温馨的夜间工作台：猫咪蹭着开发者的手，窗外灯光与水波闪动，咖啡冒着热气"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a152c"/><stop offset=".55" stop-color="#17294b"/><stop offset="1" stop-color="#131a36"/></linearGradient><linearGradient id="gl" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#bd93ff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4"/></filter></defs><style>
@keyframes tail{50%{transform:rotate(13deg)}}@keyframes nuzzle{0%,100%{transform:translate(0,0) rotate(0)}40%,65%{transform:translate(6px,-4px) rotate(3deg)}}@keyframes hand{50%{transform:translate(-2px,4px)}}@keyframes steam{0%{opacity:0;transform:translateY(14px)}30%{opacity:.65}100%{opacity:0;transform:translateY(-20px)}}@keyframes leaf{50%{transform:rotate(5deg)}}@keyframes blink{50%{opacity:.25}}@keyframes wave{50%{transform:translateX(12px);opacity:.32}}@keyframes float{50%{transform:translateY(-4px)}}.tail{transform-origin:715px 113px;animation:tail 3s ease-in-out infinite}.cat{transform-origin:790px 108px;animation:nuzzle 4s ease-in-out infinite}.hand{animation:hand 4s ease-in-out infinite}.steam{animation:steam 3.8s ease-out infinite}.s2{animation-delay:1.4s}.leaf{transform-origin:120px 110px;animation:leaf 5s ease-in-out infinite}.light{animation:blink 3.5s ease-in-out infinite}.wave{animation:wave 5s ease-in-out infinite}.orb{animation:float 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1000" height="165" rx="16" fill="url(#bg)"/><g opacity=".2"><path d="M0 125H1000M0 133H1000M0 148H1000" stroke="#6e9ec7"/></g>
<g class="light"><rect x="410" y="31" width="9" height="25" rx="2" fill="#7dd3fc"/><rect x="426" y="20" width="13" height="36" rx="2" fill="#9378ff"/><rect x="447" y="35" width="9" height="21" rx="2" fill="#f5bf90"/><rect x="462" y="14" width="12" height="42" rx="2" fill="#59bff8"/></g>
