<g class="leaf"><path d="M126 137Q124 58 146 15" stroke="#508b71" stroke-width="5" fill="none"/><ellipse cx="139" cy="32" rx="17" ry="8" transform="rotate(-31 139 32)" fill="#39795f"/><ellipse cx="114" cy="61" rx="20" ry="9" transform="rotate(32 114 61)" fill="#3a9476"/><ellipse cx="159" cy="70" rx="18" ry="9" transform="rotate(-33 159 70)" fill="#548d7a"/><ellipse cx="108" cy="96" rx="18" ry="9" transform="rotate(38 108 96)" fill="#45856a"/></g>
<rect x="52" y="114" width="122" height="7" rx="3" fill="#507299"/><rect x="170" y="94" width="9" height="38" rx="2" fill="#6b8ac0"/>
