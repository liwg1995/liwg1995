<path d="M294 98h49l-5 36h-37z" fill="#28364f" stroke="#84bdd8" stroke-width="2"/><path d="M344 105q22 0 8 21l-13 4" fill="none" stroke="#88afcf" stroke-width="4"/><path class="steam" d="M309 89q-13 -14 1 -29t0 -22" fill="none" stroke="#cbeffd" stroke-width="3" opacity=".6"/><path class="steam s2" d="M330 90q-13 -14 1 -29t0 -22" fill="none" stroke="#cbeffd" stroke-width="3" opacity=".6"/>
<g class="tail"><path d="M725 116q-45 5 -39 -29t36 -16" fill="none" stroke="#b8a3a0" stroke-width="16" stroke-linecap="round"/></g>
<g class="cat"><ellipse cx="784" cy="121" rx="64" ry="30" fill="#c6b4ac"/><path d="M813 88l8 -29 21 15 23 -9 1 31z" fill="#c2aeaa"/><path d="M822 83l5 -13 9 7 17 -3 5 14" fill="#c9a9ad"/><ellipse cx="839" cy="105" rx="40" ry="32" fill="#ded1c7"/><path d="M814 98q8 7 15 0M849 98q7 6 14 -2" fill="none" stroke="#50414b" stroke-width="3" stroke-linecap="round"/><path d="M834 107l6 4 7 -4" fill="none" stroke="#9c657e" stroke-width="2.5"/><path d="M805 109l-23 -5m23 13l-24 2m75 -9l23 -7m-22 15l26 1" stroke="#b49e99" stroke-width="2"/><ellipse cx="802" cy="134" rx="15" ry="7" fill="#f1e6dc"/></g>
<g class="hand"><path d="M968 75q-25 6 -44 18l-45 17q-14 3 -22 -8t3 -18l27 -9 25 -18" fill="#d9ad9a" stroke="#aa7c79" stroke-width="2.5"/><path d="M872 93q-10 -6 -24 4" fill="none" stroke="#f2c8b8" stroke-width="7" stroke-linecap="round"/></g>
<g font-family="Arial,sans-serif"><text x="30" y="32" fill="#8fe8fb" font-size="14" letter-spacing="2">NIGHT STUDIO</text><text x="31" y="57" fill="#d7e5ff" font-size="15">One more cuddle, then back to building.</text><text x="31" y="79" fill="#93aecd" font-size="11">Small moments, meaningful creations.</text></g>
</svg>