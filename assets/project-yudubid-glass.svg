</defs><style>
.float{animation:float 7s ease-in-out infinite;transform-origin:center}.float2{animation:float2 9s ease-in-out infinite;transform-origin:center}
.breathe{animation:breathe 4.2s ease-in-out infinite}.twinkle{animation:twinkle 3.2s ease-in-out infinite}
.slide{animation:slide 9s linear infinite}.trace{animation:trace 7s ease-in-out infinite}
.line1{animation:label1 10s infinite}.line2{animation:label2 10s infinite}.line3{animation:label3 10s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,9px)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.17}50%{opacity:.95}}
@keyframes slide{0%{transform:translateX(-460px)}100%{transform:translateX(1500px)}}
@keyframes trace{0%,100%{stroke-dashoffset:150;opacity:.35}55%{stroke-dashoffset:0;opacity:.9}}
@keyframes label1{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
@keyframes label2{0%,28%{opacity:0}33%,61%{opacity:1}67%,100%{opacity:0}}
@keyframes label3{0%,61%{opacity:0}67%,95%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line2,.line3{opacity:0!important}.line1{opacity:1!important}}
</style>
