<rect x="445" y="13" width="230" height="35" rx="17.5" fill="#121C35" stroke="#BAC9F3" stroke-opacity=".45"/>
<circle cx="461" cy="30.5" r="3.5" fill="#80EFEB" class="breathe"/>
