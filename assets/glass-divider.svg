<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated gradient light line" viewBox="0 0 1120 61" width="1120" height="61"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F21"/><stop offset=".54" stop-color="#111D39"/><stop offset="1" stop-color="#111A34"/></linearGradient>
  <radialGradient id="violet"><stop stop-color="#9567FF" stop-opacity=".62"/><stop offset=".43" stop-color="#7456EB" stop-opacity=".25"/><stop offset="1" stop-color="#7755FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="aqua"><stop stop-color="#48F0EE" stop-opacity=".53"/><stop offset=".48" stop-color="#35B9E7" stop-opacity=".22"/><stop offset="1" stop-color="#35B9E7" stop-opacity="0"/></radialGradient>
  <linearGradient id="border" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".77"/><stop offset=".24" stop-color="#DBD8FF" stop-opacity=".32"/><stop offset=".65" stop-color="#9B9DDE" stop-opacity=".12"/><stop offset="1" stop-color="#6EDAE8" stop-opacity=".47"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F7FF" stop-opacity=".185"/><stop offset=".42" stop-color="#B7BFFF" stop-opacity=".073"/><stop offset="1" stop-color="#ECFAFF" stop-opacity=".095"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2=".18"><stop stop-color="#80F3EF"/><stop offset=".52" stop-color="#97A6FF"/><stop offset="1" stop-color="#C397FF"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".48" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".11"/><stop offset=".52" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="horizon" x1="0" x2="1"><stop stop-color="#85FEF0" stop-opacity="0"/><stop offset=".5" stop-color="#85FEF0" stop-opacity=".72"/><stop offset="1" stop-color="#AD8CFF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#BED4FF" stroke-opacity=".048"/><circle cx="1" cy="1" r="1.2" fill="#B7E7F9" fill-opacity=".14"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-30%" y="-40%" width="165%" height="190%"><feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#030916" flood-opacity=".55"/></filter>
  <clipPath id="mainclip"><rect x="20" y="19" width="1080" height="392" rx="33"/></clipPath>
</defs><style>
.float{animation:float 7s ease-in-out infinite;transform-origin:center}.float2{animation:float2 9s ease-in-out infinite;transform-origin:center}
.breathe{animation:breathe 4.2s ease-in-out infinite}.twinkle{animation:twinkle 3.2s ease-in-out infinite}
.slide{animation:slide 9s linear infinite}.trace{animation:trace 7s ease-in-out infinite}
.line1{animation:label1 10s infinite}.line2{animation:label2 10s infinite}.line3{animation:label3 10s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,9px)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.17}50%{opacity:.95}}
@keyframes slide{0%{transform:translateX(-460px)}100%{transform:translateX(1500px)}}
@keyframes trace{0%,100%{stroke-dashoffset:150;opacity:.35}55%{stroke-dashoffset:0;opacity:.9}}
@keyframes label1{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
@keyframes label2{0%,28%{opacity:0}33%,61%{opacity:1}67%,100%{opacity:0}}
@keyframes label3{0%,61%{opacity:0}67%,95%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line2,.line3{opacity:0!important}.line1{opacity:1!important}}
</style>
<rect x="16" y="30" width="1088" height="1" fill="url(#horizon)"/><rect x="10" y="29" width="1100" height="3" fill="#ADB8EC" fill-opacity=".09"/>
