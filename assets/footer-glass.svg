<path d="M20 9H504" stroke="#FFFFFF" stroke-opacity=".36"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="560" y="56" fill="#F1F6FF" font-size="28" font-weight="700" letter-spacing="6">THINK  ·  BUILD  ·  SHARE</text><text x="560" y="85" fill="#9FB4D5" font-size="12" letter-spacing="3.5">CRAFTED WITH CURIOSITY   /   LIWG</text></g>
<g class="slide"><path d="M-140 6L-72 6L34 114L-34 114Z" fill="url(#shine)"/></g>
<circle cx="1015" cy="61" r="5" fill="#8BF3EB" class="breathe"/>
</svg>