name: Generate Contribution Snake
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: liwg1995
          outputs: |
            dist/new-snake-light.svg?palette=github-light&color_snake=%233B82F6
            dist/new-snake-dark.svg?palette=github-dark&color_snake=%2367E8F9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cp dist/new-snake-light.svg assets/new-snake-light.svg
          cp dist/new-snake-dark.svg assets/new-snake-dark.svg
      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/new-snake-*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh contribution snake" && git push)
